<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <clipPath id="c"><rect width="640" height="360" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="640" height="360" fill="#000"/>
    <rect width="640" height="38" fill="url(#bar)"/>
    <circle cx="22" cy="19" r="6" fill="#fff" fill-opacity="0.85"/>
    <circle cx="42" cy="19" r="6" fill="#fff" fill-opacity="0.5"/>
    <circle cx="62" cy="19" r="6" fill="#fff" fill-opacity="0.25"/>
    <text x="320" y="24" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9a9a9a" letter-spacing="1">claude  —  roblox-gui-kit</text>

    <g font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15">
      <text x="24" y="76"  fill="#8a8a8a">$</text>
      <text x="42" y="76"  fill="#ffffff">git clone github.com/kolioty/roblox-gui-kit</text>

      <text x="24" y="128" fill="#8a8a8a">&gt;</text>
      <text x="42" y="128" fill="#ffffff">Hazme una tienda con 3 botones de compra</text>

      <text x="42" y="166" fill="#bdbdbd">conectando con Roblox Studio</text>
      <text x="42" y="192" fill="#bdbdbd">estilo A · Chunky  (guinew)</text>
      <text x="42" y="218" fill="#bdbdbd">construyendo ScreenGui "Shop"</text>
      <text x="42" y="244" fill="#bdbdbd">revisando captura de pantalla</text>
      <text x="42" y="278" fill="#ffffff" font-weight="700">listo</text>
      <rect x="86" y="264" width="9" height="18" fill="#fff">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="320" y="340" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6a6a6a" letter-spacing="2">EJEMPLO ILUSTRATIVO</text>
  </g>
  <rect x="1" y="1" width="638" height="358" rx="12" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2"/>
</svg>
