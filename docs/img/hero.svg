<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07040f"/>
      <stop offset="0.55" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#04141d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1DCB32"/>
      <stop offset="0.35" stop-color="#00EAFF"/>
      <stop offset="0.7" stop-color="#BF00FF"/>
      <stop offset="1" stop-color="#FF72FF"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BF00FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#BF00FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00EAFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00EAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1DCB32" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1DCB32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00EAFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00EAFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00EAFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a3a66" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>

    <!-- orbes de luz -->
    <circle cx="170" cy="90" r="260" fill="url(#orbA)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="360" r="300" fill="url(#orbB)">
      <animate attributeName="cy" values="360;300;360" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="220" fill="url(#orbC)">
      <animate attributeName="cx" values="700;620;700" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- línea de escaneo -->
    <rect x="0" y="-120" width="1280" height="120" fill="url(#scan)">
      <animate attributeName="y" values="-120;440" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- circuitos -->
    <g fill="none" stroke="#00EAFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
      <path d="M40 330 H180 L210 300 H340"/>
      <path d="M40 360 H120 L150 390 H300"/>
      <path d="M1240 90 H1110 L1080 120 H960"/>
      <path d="M1240 60 H1160 L1130 30 H1020"/>
    </g>
    <g fill="#00EAFF">
      <circle cx="340" cy="300" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="390" r="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="120" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="30" r="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- botones flotantes decorativos -->
    <g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="90" y="150" width="190" height="62" rx="6" fill="#1DCB32" stroke="#0a2a10" stroke-width="5"/>
        <rect x="90" y="150" width="190" height="31" rx="6" fill="#A6FF00" opacity="0.55"/>
        <text x="185" y="193" text-anchor="middle" font-family="Segoe UI, Arial Black, sans-serif" font-weight="900" font-size="30" fill="#fff" stroke="#161A21" stroke-width="5" paint-order="stroke">BUY</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="6s" repeatCount="indefinite"/>
        <rect x="1000" y="250" width="190" height="62" rx="6" fill="#007BFF" stroke="#001a40" stroke-width="5"/>
        <rect x="1000" y="250" width="190" height="31" rx="6" fill="#00EAFF" opacity="0.55"/>
        <text x="1095" y="293" text-anchor="middle" font-family="Segoe UI, Arial Black, sans-serif" font-weight="900" font-size="30" fill="#fff" stroke="#161A21" stroke-width="5" paint-order="stroke">OPEN</text>
      </g>
    </g>

    <!-- título -->
    <g text-anchor="middle" font-family="Segoe UI, Arial Black, Impact, sans-serif" font-weight="900">
      <text x="640" y="196" font-size="92" fill="url(#title)" filter="url(#glow)" letter-spacing="3">ROBLOX GUI KIT</text>
      <text x="640" y="196" font-size="92" fill="url(#title)" letter-spacing="3">ROBLOX GUI KIT</text>
      <text x="640" y="250" font-size="26" font-weight="600" fill="#9fb4ff" letter-spacing="9">CLAUDE  ×  ROBLOX STUDIO MCP</text>
    </g>

    <!-- chip by Pedry -->
    <g transform="translate(640 330)">
      <rect x="-118" y="-30" width="236" height="60" rx="30" fill="#0f1530" stroke="#BF00FF" stroke-width="2.5" filter="url(#glow)"/>
      <rect x="-118" y="-30" width="236" height="60" rx="30" fill="#0f1530" stroke="#BF00FF" stroke-width="2.5"/>
      <circle cx="-84" cy="0" r="8" fill="#1DCB32"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="8" y="9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="26" fill="#fff" letter-spacing="2">by Pedry</text>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="1277" height="437" rx="21" fill="none" stroke="#BF00FF" stroke-opacity="0.6" stroke-width="3"/>
</svg>
